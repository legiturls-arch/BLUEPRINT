
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLUEPRINT | Engineering Library</title>
  <link rel="stylesheet" href="./space.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./builder.html">
      <span class="brand-mark">B</span>
      <span><strong>BLUEPRINT</strong><small>VIRTUAL ENGINEERING LAB</small></span>
    </a>
    <nav>
      <a href="./space.html" class="active">Engineering Library</a>
      <a href="./builder.html">3D Builder</a>
    </nav>
    <span id="connection-status">Connecting…</span>
  </header>


  
<main id="space-library">
    <h1>BLUEPRINT Space Library</h1>
    <p>Explore components for space engineering projects.</p>

    <section class="stats">
        <div><strong id="total-count">—</strong> Components</div>
        <div><strong id="space-count">—</strong> Space components</div>
        <div><strong id="category-count">—</strong> Categories</div>
    </section>

    <input
        type="search"
        id="search"
        placeholder="Search components..."
        aria-label="Search components"
    >

    <select id="library-filter" aria-label="Select library">
        <option value="all">All libraries</option>
        <option value="engineering">Engineering</option>
        <option value="space">Space Library</option>
    </select>

    <select id="category-filter" aria-label="Filter by category">
        <option value="all">All categories</option>
    </select>

    <select id="type-filter" aria-label="Filter by component type">
        <option value="all">All component types</option>
    </select>

    <select id="sort-order" aria-label="Sort components">
        <option value="name">Sort by name</option>
        <option value="category">Sort by category</option>
    </select>

    <button id="clear-filters" type="button">Clear filters</button>

    <div id="category-chips" class="chips"></div>

    <p id="result-count">Loading components...</p>
    <div id="message" class="message" hidden></div>
    <div id="component-grid" class="component-grid"></div>
</main>


<script src="./space.js" defer></script>
</body>
</html>
